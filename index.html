<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Kauê Araujo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    :root {
      --primary: #6c63ff;
      --primary-dark: #574fd6;
      --bg-dark: #0f0f1a;
      --bg-card: #1a1a2e;
      --text-muted-custom: #a0a0c0;
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--bg-dark);
      color: #e0e0f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border-bottom: 1px solid rgba(108, 99, 255, 0.3);
      padding: 1.5rem 0;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #fff;
      margin: 0;
    }

    header h1 span {
      color: var(--primary);
    }

    .badge-tm {
      background: rgba(108, 99, 255, 0.15);
      color: var(--primary);
      border: 1px solid rgba(108, 99, 255, 0.4);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      padding: 4px 10px;
      border-radius: 20px;
    }

    .main-card {
      background: var(--bg-card);
      border: 1px solid rgba(108, 99, 255, 0.2);
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
    }

    .btn-start {
      background: var(--primary);
      border: none;
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      padding: 14px 36px;
      border-radius: 50px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(108, 99, 255, 0.4);
    }

    .btn-start:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 6px 28px rgba(108, 99, 255, 0.55);
    }

    .btn-start:active {
      transform: translateY(0px);
    }

    .btn-start:disabled {
      background: #444;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    .btn-start svg {
      width: 20px;
      height: 20px;
    }

    .webcam-wrapper {
      background: #0a0a14;
      border: 1px solid rgba(108, 99, 255, 0.25);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 220px;
      position: relative;
    }

    .webcam-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: var(--text-muted-custom);
      font-size: 0.9rem;
    }

    .webcam-placeholder svg {
      width: 48px;
      height: 48px;
      opacity: 0.4;
    }

    #webcam-container canvas {
      border-radius: 12px;
      max-width: 100%;
      height: auto;
    }

    .section-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted-custom);
      margin-bottom: 1rem;
    }

    .prediction-item {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
      transition: border-color 0.3s;
    }

    .prediction-item.active {
      border-color: rgba(108, 99, 255, 0.5);
    }

    .prediction-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .class-name {
      font-size: 0.9rem;
      font-weight: 600;
      color: #e0e0f0;
    }

    .class-percent {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--primary);
      min-width: 44px;
      text-align: right;
    }

    .progress {
      height: 8px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar-custom {
      height: 100%;
      border-radius: 10px;
      background: linear-gradient(90deg, var(--primary) 0%, #a78bfa 100%);
      transition: width 0.3s ease;
      width: 0%;
    }

    .progress-bar-custom.high {
      background: linear-gradient(90deg, #22c55e 0%, #86efac 100%);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #444;
      display: inline-block;
      margin-right: 6px;
      transition: background 0.3s;
    }

    .status-dot.active {
      background: #22c55e;
      box-shadow: 0 0 6px #22c55e88;
    }

    .status-text {
      font-size: 0.78rem;
      color: var(--text-muted-custom);
    }

    footer {
      border-top: 1px solid rgba(108, 99, 255, 0.15);
      padding: 1.2rem 0;
      font-size: 0.78rem;
      color: var(--text-muted-custom);
    }

    @media (max-width: 576px) {
      .main-card { padding: 1.2rem; }
      header h1 { font-size: 1.2rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="container">
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
        <h1>Kauê <span>Araujo</span></h1>
        <span class="badge-tm">Teachable Machine</span>
      </div>
    </div>
  </header>

  <main class="container py-4 py-md-5">
    <div class="main-card">
      <div class="row g-4 align-items-start">

        <div class="col-12 col-md-6">
          <p class="section-label">Câmera</p>

          <div class="webcam-wrapper mb-3" id="webcam-container">
            <div class="webcam-placeholder" id="placeholder">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M15 10l4.553-2.069A1 1 0 0121 8.82v6.36a1 1 0 01-1.447.89L15 14M3 8a2 2 0 012-2h10a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"/>
              </svg>
              <span>A câmera aparecerá aqui</span>
            </div>
          </div>

          <div class="d-flex align-items-center justify-content-between flex-wrap gap-3">
            <button class="btn-start" id="startBtn" onclick="init()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M15 10l4.553-2.069A1 1 0 0121 8.82v6.36a1 1 0 01-1.447.89L15 14M3 8a2 2 0 012-2h10a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"/>
              </svg>
              Iniciar Câmera
            </button>

            <div>
              <span class="status-dot" id="statusDot"></span>
              <span class="status-text" id="statusText">Aguardando inicialização</span>
            </div>
          </div>
        </div>

        <div class="col-12 col-md-6">
          <p class="section-label">Resultados da Classificação</p>
          <div id="label-container">
            <div class="text-center py-4" style="color: var(--text-muted-custom); font-size: 0.85rem;">
              Inicie a câmera para ver as predições
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <footer>
    <div class="container text-center">
      Desenvolvido por <strong style="color: var(--primary);">Kauê Araujo</strong> &mdash; Powered by Teachable Machine + TensorFlow.js
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
  <script>
    const URL = "https://teachablemachine.withgoogle.com/models/aOY-mKp7c/";
    let model, webcam, labelContainer, maxPredictions;
    let predictionBars = [];

    function setStatus(text, active) {
      document.getElementById('statusText').textContent = text;
      const dot = document.getElementById('statusDot');
      if (active) dot.classList.add('active');
      else dot.classList.remove('active');
    }

    async function init() {
      const btn = document.getElementById('startBtn');
      btn.disabled = true;
      btn.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
          <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
        </svg>
        Carregando...`;
      setStatus('Carregando modelo...', false);

      try {
        model = await tmImage.load(URL + "model.json", URL + "metadata.json");
        maxPredictions = model.getTotalClasses();

        const flip = true;
        webcam = new tmImage.Webcam(280, 280, flip);
        await webcam.setup();
        await webcam.play();

        const container = document.getElementById('webcam-container');
        document.getElementById('placeholder').style.display = 'none';
        container.appendChild(webcam.canvas);

        labelContainer = document.getElementById('label-container');
        labelContainer.innerHTML = '';
        predictionBars = [];

        for (let i = 0; i < maxPredictions; i++) {
          const item = document.createElement('div');
          item.className = 'prediction-item';
          item.innerHTML = `
            <div class="prediction-header">
              <span class="class-name" id="name-${i}">Classe ${i + 1}</span>
              <span class="class-percent" id="percent-${i}">0%</span>
            </div>
            <div class="progress">
              <div class="progress-bar-custom" id="bar-${i}"></div>
            </div>`;
          labelContainer.appendChild(item);
          predictionBars.push(item);
        }

        setStatus('Modelo ativo', true);
        btn.innerHTML = `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
            <circle cx="12" cy="12" r="10"/><path d="M10 9l5 3-5 3V9z"/>
          </svg>
          Em Execução`;

        window.requestAnimationFrame(loop);
      } catch (e) {
        setStatus('Erro ao iniciar câmera', false);
        btn.disabled = false;
        btn.innerHTML = `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
            <path d="M15 10l4.553-2.069A1 1 0 0121 8.82v6.36a1 1 0 01-1.447.89L15 14M3 8a2 2 0 012-2h10a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"/>
          </svg>
          Tentar Novamente`;
        console.error(e);
      }
    }

    async function loop() {
      webcam.update();
      await predict();
      window.requestAnimationFrame(loop);
    }

    async function predict() {
      const prediction = await model.predict(webcam.canvas);
      let maxIdx = 0;
      let maxProb = 0;

      for (let i = 0; i < maxPredictions; i++) {
        if (prediction[i].probability > maxProb) {
          maxProb = prediction[i].probability;
          maxIdx = i;
        }
      }

      for (let i = 0; i < maxPredictions; i++) {
        const prob = prediction[i].probability;
        const pct = (prob * 100).toFixed(1);
        const bar = document.getElementById(`bar-${i}`);
        const percent = document.getElementById(`percent-${i}`);
        const nameEl = document.getElementById(`name-${i}`);
        const item = predictionBars[i];

        nameEl.textContent = prediction[i].className;
        percent.textContent = pct + '%';
        bar.style.width = pct + '%';

        if (i === maxIdx && prob > 0.5) {
          bar.classList.add('high');
          item.classList.add('active');
        } else {
          bar.classList.remove('high');
          item.classList.remove('active');
        }
      }
    }
  </script>
</body>
</html>
